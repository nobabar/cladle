name: Feature request
description: Suggest an idea or improvement for cladle
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Share the problem you want to solve and any ideas for how to solve it.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or need is this feature meant to address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, examples from other games, or related issues.
    validations:
      required: false
