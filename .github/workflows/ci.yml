name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Run type checking
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build verification
        run: pnpm run build

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore E2E success marker cache
        id: e2e-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/e2e-success-marker
          key: e2e-success-pr-${{ github.event.pull_request.number }}

      - name: Skip note when E2E already passed
        if: steps.e2e-cache-restore.outputs.cache-hit == 'true'
        run: echo "E2E already succeeded for this PR; skipping rerun on this push."

      - name: Install Playwright browsers
        if: steps.e2e-cache-restore.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        if: steps.e2e-cache-restore.outputs.cache-hit != 'true'
        run: pnpm run test:e2e

      - name: Create E2E success marker
        if: steps.e2e-cache-restore.outputs.cache-hit != 'true' && success()
        run: mkdir -p .ci-cache && echo "passed" > .ci-cache/e2e-success-marker

      - name: Save E2E success marker cache
        if: steps.e2e-cache-restore.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/e2e-success-marker
          key: e2e-success-pr-${{ github.event.pull_request.number }}
